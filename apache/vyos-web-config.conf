<VirtualHost *:80>
    ServerName vyos-web-config.local

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog /opt/vyos-web-config/logs/apache-error.log
    CustomLog /opt/vyos-web-config/logs/apache-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName vyos-web-config.local

    SSLEngine on
    SSLCertificateFile /opt/vyos-web-config/apache/cert.pem
    SSLCertificateKeyFile /opt/vyos-web-config/apache/key.pem

    # Modern TLS configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on

    DocumentRoot /opt/vyos-web-config/frontend

    <Directory /opt/vyos-web-config/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_URI} !^/ws/
        RewriteRule ^ /index.html [L]
    </Directory>

    # API routes served by mod_wsgi
    WSGIScriptAlias /api /opt/vyos-web-config/backend/app.wsgi
    WSGIDaemonProcess vyos-web-config user=vyos group=users threads=10 processes=1 python-home=/opt/vyos-web-config/venv
    WSGIProcessGroup vyos-web-config
    WSGIApplicationGroup %{GLOBAL}

    <Directory /opt/vyos-web-config/backend>
        Require all granted
    </Directory>

    # WebSocket reverse proxy to standalone monitor server
    ProxyPreserveHost On
    ProxyPass /ws/ ws://127.0.0.1:8765/
    ProxyPassReverse /ws/ ws://127.0.0.1:8765/
    <Proxy *>
        Require all granted
    </Proxy>

    ErrorLog /opt/vyos-web-config/logs/apache-error.log
    CustomLog /opt/vyos-web-config/logs/apache-access.log combined
</VirtualHost>
